name: metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AliRizaAynaci
          filename: metrics.languages.svg
          base: ""
          config_theme: dark
          config_animations: no
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_colors: github

      - name: isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AliRizaAynaci
          filename: metrics.isocalendar.svg
          base: ""
          config_theme: dark
          config_animations: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: generate terminal card
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 .github/scripts/terminal_card.py

      - name: commit terminal card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics.terminal.svg
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh terminal metrics card"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
