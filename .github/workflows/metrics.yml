name: metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AliRizaAynaci
          filename: metrics.calendar.svg
          base: ""
          config_theme: dark
          config_padding: 0, 8
          config_animations: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: generate terminal card
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 .github/scripts/terminal_card.py

      - name: commit terminal card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics.terminal.svg
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh terminal metrics card"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: top languages
        run: |
          curl -fsSL -o languages.svg \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=AliRizaAynaci&langs_count=6&theme=react&hide_border=true&bg_color=0d1117&title_color=58a6ff&text_color=c9d1d9&border_radius=12&card_width=320"

      - name: commit languages card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add languages.svg
          git diff --staged --quiet || (git commit -m "chore: update languages card" && git push)
