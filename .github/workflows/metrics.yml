name: metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AliRizaAynaci
          filename: metrics.overview.svg
          base: header, activity, community, repositories
          config_timezone: Europe/Istanbul
          extras_css: &theme |
            svg { color: #8b949e; }
            h1, h2, h3 { color: #58a6ff; }
            .field svg { fill: #8b949e; }
            .field.language.details small, .gauge .title { color: #8b949e; }

      - name: isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AliRizaAynaci
          filename: metrics.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          extras_css: *theme

      - name: languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AliRizaAynaci
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          plugin_lines: yes
          plugin_lines_sections: base
          extras_css: *theme

      - name: habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AliRizaAynaci
          filename: metrics.habits.svg
          base: ""
          config_timezone: Europe/Istanbul
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          extras_css: *theme
